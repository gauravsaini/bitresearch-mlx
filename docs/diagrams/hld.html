<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitResearch MLX — High-Level Swarm Architecture (HLD)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1120px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 2.5vw + 1rem, 2.4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">High-Level Architecture · Swarm Topology</p>
    <h1>BitResearch MLX: Distributed Swarm System</h1>

    <svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-title hld-desc">
      <title id="hld-title">BitResearch MLX — High-Level Swarm Architecture (HLD)</title>
      <desc id="hld-desc">High-level architecture showing the Coordinator managing an autonomous mutation research loop and scheduling experiments over mDNS and WebSockets across heterogeneous Apple Silicon Macs.</desc>

      <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1" fill="rgba(45,49,66,0.08)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Clean paper background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

      <!-- ================= ZONE 1: COORDINATOR ================= -->
      <rect x="40" y="56" width="320" height="400" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="64" y="60" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="132" y="69" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">COORDINATOR NODE</text>

      <!-- ================= ZONE 2: NETWORK BUS ================= -->
      <rect x="392" y="56" width="216" height="400" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="416" y="60" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="69" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">LOCAL NETWORK / BUS</text>

      <!-- ================= ZONE 3: WORKER FLEET ================= -->
      <rect x="640" y="56" width="360" height="400" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="664" y="60" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="69" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">WORKER FLEET (MLX)</text>

      <!-- ================= CONNECTORS (Z-ORDER: BEFORE BOXES) ================= -->
      <!-- 1. Node A (Autonomous) -> Node B (Tracker) vertical -->
      <line x1="200" y1="176" x2="200" y2="208" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="168" y="184" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="193" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MUTATIONS</text>

      <!-- 2. Node B (Tracker) -> Node C (Hub) vertical -->
      <line x1="200" y1="288" x2="200" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="176" y="296" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="305" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

      <!-- 3. Node C (Hub) -> Node D (mDNS) orthogonal -->
      <!-- Exit Hub top at x=336, y=340; enters mDNS bottom at x=460, y=176 -->
      <path d="M 336,340 H 420 Q 428,340 428,332 V 184 Q 428,176 436,176 H 440"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="360" y="250" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="388" y="259" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADVERTISE</text>

      <!-- 4. Node C (Hub) -> Node E (Socket Wire) horizontal -->
      <line x1="336" y1="368" x2="420" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="352" y="348" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="378" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASSIGN</text>

      <!-- 5. Node E (Socket Wire) -> Worker F (M1 Base) orthogonal -->
      <!-- Exit Node E right at x=580, y=344 -> enters Worker F left at x=664, y=136 -->
      <path d="M 580,344 H 616 Q 624,344 624,336 V 144 Q 624,136 632,136 H 664"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 6. Node E (Socket Wire) -> Worker G (M3 Max) orthogonal -->
      <!-- Exit Node E right at x=580, y=368 -> enters Worker G left at x=664, y=248 -->
      <path d="M 580,368 H 616 Q 624,368 624,360 V 256 Q 624,248 632,248 H 664"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 7. Node E (Socket Wire) -> Worker H (M4 Ultra) horizontal -->
      <!-- Exit Node E right at x=580, y=392 -> enters Worker H left at x=664, y=368 -->
      <path d="M 580,392 H 616 Q 624,392 624,384 V 376 Q 624,368 632,368 H 664"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="596" y="278" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="624" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASSIGN</text>

      <!-- 8. Telemetry stream return (dashed arrow from Fleet back to Socket Wire) -->
      <!-- Exits Worker G at x=664, y=272 -> enters Node E right at x=580, y=320 -->
      <path d="M 664,272 H 636 Q 628,272 628,280 V 312 Q 628,320 620,320 H 580"
            fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="612" y="296" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="305" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TELEMETRY</text>

      <!-- ================= ZONE 1 NODES: COORDINATOR ================= -->
      <!-- Node A: Autonomous Engine (FOCAL) -->
      <rect x="64" y="96" width="272" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="96" width="272" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="76" y="104" width="48" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="100" y="114" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTONOMY</text>
      <text x="200" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Autonomous Research Loop</text>
      <text x="200" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mutation.py · patience &amp; generations</text>

      <!-- Node B: Experiment Tracker -->
      <rect x="64" y="208" width="272" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="208" width="272" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="76" y="216" width="36" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="94" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="200" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Experiment Tracker &amp; Git</text>
      <text x="200" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keep / revert branch · results.tsv</text>

      <!-- Node C: Coordinator Hub -->
      <rect x="64" y="320" width="272" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="320" width="272" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="76" y="328" width="32" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="92" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUB</text>
      <text x="200" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WebSocket Coordinator Hub</text>
      <text x="200" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">speculative pruner · port 8765</text>

      <!-- ================= ZONE 2 NODES: NETWORK ================= -->
      <!-- Node D: Bonjour mDNS -->
      <rect x="420" y="112" width="160" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="112" width="160" height="76" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
      <rect x="432" y="120" width="36" height="14" rx="2" fill="transparent" stroke="rgba(46,90,168,0.40)" stroke-width="0.8"/>
      <text x="450" y="130" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">mDNS</text>
      <text x="500" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bonjour Discovery</text>
      <text x="500" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zeroconf local network</text>

      <!-- Node E: Wire Transport -->
      <rect x="420" y="320" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="320" width="160" height="80" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="432" y="328" width="40" height="14" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="452" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOCKET</text>
      <text x="500" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JSON Wire Protocol</text>
      <text x="500" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bi-directional streaming</text>

      <!-- ================= ZONE 3 NODES: WORKER FLEET ================= -->
      <!-- Node F: M1 / M2 Base -->
      <rect x="664" y="96" width="312" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="96" width="312" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="676" y="104" width="56" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="704" y="114" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIER:BASE</text>
      <text x="820" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MacBook Air (M1 / M2 · 16GB)</text>
      <text x="820" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scaler: batch=8 · grad_accum=8 · MLX</text>

      <!-- Node G: M3 / M4 Max -->
      <rect x="664" y="208" width="312" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="208" width="312" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="676" y="216" width="52" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="702" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIER:MAX</text>
      <text x="820" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MacBook Pro (M3 / M4 Max · 64GB)</text>
      <text x="820" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scaler: batch=32 · grad_accum=2 · MLX</text>

      <!-- Node H: M2 / M4 Ultra -->
      <rect x="664" y="320" width="312" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="320" width="312" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="676" y="328" width="60" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="706" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TIER:ULTRA</text>
      <text x="820" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mac Studio (M2 / M4 Ultra · 192GB)</text>
      <text x="820" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scaler: batch=64 · grad_accum=1 · MLX</text>

      <!-- ================= LEGEND BAR ================= -->
      <line x1="40" y1="492" x2="1000" y2="492" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="508" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="144" y="516" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Focal / Loop</text>

      <rect x="240" y="508" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="516" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Core Component</text>

      <rect x="380" y="508" width="16" height="10" rx="2" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
      <text x="404" y="516" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Discovery / Protocol</text>

      <line x1="520" y1="512" x2="540" y2="512" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="548" y="516" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Telemetry Stream</text>
    </svg>
  </div>
</body>
</html>
