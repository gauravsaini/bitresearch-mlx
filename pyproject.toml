[project]
name = "bitresearch-mlx"
version = "0.1.0"
description = "Distributed swarm autoresearch on Apple Silicon — autonomous ML research loops across multiple Macs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mlx>=0.30.0",
    "numpy>=2.2.6",
    "pyarrow>=21.0.0",
    "regex>=2025.7.34",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "websockets>=15.0",
    "zeroconf>=0.140.0",
    "rich>=14.0.0",
    "click>=8.1.0",
    "psutil>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
bitresearch = "swarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm"]
