<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitResearch Swarm — Low-Level Component Design (LLD)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame { max-width: 1120px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 2.5vw + 1rem, 2.4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Component Specification · Execution Pipeline</p>
    <h1>BitResearch Swarm: Low-Level Component Design</h1>

    <svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lld-title lld-desc">
      <title id="lld-title">BitResearch Swarm — Low-Level Component Design (LLD)</title>
      <desc id="lld-desc">Low-level execution pipeline showing mutation generation, hardware scaling, in-process runner execution, telemetry streaming, and speculative pruning feedback.</desc>

      <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1" fill="rgba(45,49,66,0.08)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Clean paper background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

      <!-- ================= ZONE 1: COORDINATOR CORE ================= -->
      <rect x="40" y="56" width="440" height="400" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="64" y="60" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="148" y="69" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">COORDINATOR CORE MODULES</text>

      <!-- ================= ZONE 2: WORKER RUNTIME ================= -->
      <rect x="560" y="56" width="440" height="400" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="584" y="60" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="69" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">WORKER EXECUTION RUNTIME</text>

      <!-- ================= CONNECTORS (Z-ORDER: BEFORE BOXES) ================= -->
      <!-- 1. MutationEngine -> Tracker (vertical) -->
      <line x1="260" y1="172" x2="260" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="220" y="184" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="260" y="193" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CANDIDATES</text>

      <!-- 2. Tracker -> Scaler (orthogonal across zones, offset x=508) -->
      <path d="M 456,236 H 500 Q 508,236 508,228 V 142 Q 508,134 516,134 H 584"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="472" y="176" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="185" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPEC (SPEC)</text>

      <!-- 3. Scaler -> Runner (vertical) -->
      <line x1="780" y1="172" x2="780" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="740" y="184" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="780" y="193" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENV OVERRIDE</text>

      <!-- 4. Runner -> MLX Training Engine (vertical) -->
      <line x1="688" y1="292" x2="688" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="652" y="304" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="688" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBPROCESS</text>

      <!-- 5. MLX Training Engine -> Telemetry Stream (horizontal) -->
      <line x1="792" y1="374" x2="816" y2="374" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="794" y="356" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="814" y="365" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JSONL</text>

      <!-- 6. Telemetry Stream -> Threshold Pruner (feedback loop across zones) -->
      <path d="M 896,412 V 428 Q 896,436 888,436 H 268 Q 260,436 260,428 V 412"
            fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="532" y="430" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="576" y="439" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STEP_TELEMETRY</text>

      <!-- 7. Threshold Pruner -> Runner (cancel kill-switch, offset x=536) -->
      <path d="M 456,374 H 528 Q 536,374 536,366 V 262 Q 536,254 544,254 H 584"
            fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="496" y="312" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="536" y="321" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KILL (CANCEL)</text>

      <!-- 8. Runner -> Tracker (RESULT bridge hop over x=508 and x=536) -->
      <path d="M 584,272 H 544 a 8,8 0 0,1 -16,0 H 516 a 8,8 0 0,1 -16,0 H 456"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="472" y="278" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VAL_BPB</text>

      <!-- ================= ZONE 1 NODES: COORDINATOR ================= -->
      <!-- Node 1: MutationEngine -->
      <rect x="64" y="96" width="392" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="96" width="392" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="76" y="104" width="56" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="104" y="114" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MUTATION</text>
      <text x="260" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MutationEngine (swarm/mutation.py)</text>
      <text x="260" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HyperparamPerturb + ArchitectureScale strategies</text>

      <!-- Node 2: ExperimentTracker -->
      <rect x="64" y="216" width="392" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="216" width="392" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="76" y="224" width="48" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="100" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORAGE</text>
      <text x="260" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ExperimentTracker (swarm/experiment.py)</text>
      <text x="260" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Git branch commit/revert · results.tsv · Queue</text>

      <!-- Node 3: ThresholdPruner (FOCAL) -->
      <rect x="64" y="336" width="392" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="336" width="392" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="76" y="344" width="44" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="98" y="354" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRUNER</text>
      <text x="260" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ThresholdPruner (swarm/telemetry.py)</text>
      <text x="260" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Fast kill: loss &gt; 2× best_val_bpb or NaN within 30s</text>

      <!-- ================= ZONE 2 NODES: WORKER RUNTIME ================= -->
      <!-- Node 4: ParameterScaler -->
      <rect x="584" y="96" width="392" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="96" width="392" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="596" y="104" width="44" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="618" y="114" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCALER</text>
      <text x="780" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ParameterScaler (swarm/scaler.py)</text>
      <text x="780" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Unified memory model · device_batch_size headroom</text>

      <!-- Node 5: TrainRunner -->
      <rect x="584" y="216" width="392" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="216" width="392" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="596" y="224" width="44" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="618" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNNER</text>
      <text x="780" y="254" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TrainRunner (swarm/runner.py)</text>
      <text x="780" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">In-process execution adapter · timeouts &amp; SIGKILL cancel</text>

      <!-- Node 6: MLX Training Engine -->
      <rect x="584" y="336" width="208" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="336" width="208" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="596" y="344" width="40" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="616" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KERNEL</text>
      <text x="688" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">train.py (MLX)</text>
      <text x="688" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU unified training</text>

      <!-- Node 7: TelemetryStream -->
      <rect x="816" y="336" width="160" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="816" y="336" width="160" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="828" y="344" width="40" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="848" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STREAM</text>
      <text x="896" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TelemetryStream</text>
      <text x="896" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Incremental JSONL</text>

      <!-- ================= LEGEND BAR ================= -->
      <line x1="40" y1="492" x2="1000" y2="492" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="508" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="144" y="516" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Focal / Pruning Control</text>

      <rect x="300" y="508" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="324" y="516" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Module Component</text>

      <line x1="470" y1="512" x2="490" y2="512" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="498" y="516" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Feedback / Kill Switch</text>

      <line x1="660" y1="512" x2="680" y2="512" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="688" y="516" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif">Assignment Wire</text>
    </svg>
  </div>
</body>
</html>
